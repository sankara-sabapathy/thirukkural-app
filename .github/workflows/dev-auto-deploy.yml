name: Auto-Deploy Dev (Feature and Codex Branches)

on:
  push:
    branches:
      - 'feature/*'
      - 'codex/*'

jobs:
  # 1. Run Backend Unit Tests
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Unit Tests
      run: npx vitest run --passWithNoTests

  # 2. Run Frontend Unit Tests
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Unit Tests
      run: npx vitest run --passWithNoTests

  # 3. Deploy Backend (Only if tests pass)
  deploy-backend:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Bootstrap CDK
      run: npx cdk bootstrap --skip-if-bootstrapped

    - name: Deploy CDK Stack (Dev)
      run: npx cdk deploy --require-approval never -c stage=dev

  # 4. Deploy Frontend (Only if Backend deploy succeeds)
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Fetch Configuration & Build Environment
      run: |
        set -e
        STAGE="dev"
        STACK_NAME="ThirukkuralStack-Dev"
        
        echo "Fetching outputs from Stack: $STACK_NAME"
        
        get_output() {
          local val
          val=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text)
          if [ $? -ne 0 ]; then
             echo "Error fetching output $1 from stack $STACK_NAME" >&2
             exit 1
          fi
          echo "$val"
        }
        
        API_URL=$(get_output 'ApiUrl')
        USER_POOL_ID=$(get_output 'UserPoolId')
        CLIENT_ID=$(get_output 'UserPoolClientId')
        USER_POOL_DOMAIN=$(get_output 'UserPoolDomain')
        # Strip https:// prefix as Amplify expects just the domain
        USER_POOL_DOMAIN=${USER_POOL_DOMAIN#https://}
        BUCKET_NAME=$(get_output 'WebsiteBucketName')
        
        # SSM Parameters
        VAPID_KEY=$(aws ssm get-parameter --name "/$STAGE/thirukkural/vapid_public_key" --query "Parameter.Value" --output text)
        BASE_DOMAIN=$(aws ssm get-parameter --name "/$STAGE/thirukkural/base_domain" --query "Parameter.Value" --output text)
        RAZORPAY_KEY=$(aws ssm get-parameter --name "/$STAGE/thirukkural/razorpay_key_id" --with-decryption --query "Parameter.Value" --output text)

        echo "API_BASE_URL=$API_URL" >> $GITHUB_ENV
        echo "COGNITO_USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_ENV
        echo "COGNITO_WEB_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
        echo "COGNITO_DOMAIN=$USER_POOL_DOMAIN" >> $GITHUB_ENV
        echo "VAPID_PUBLIC_KEY=$VAPID_KEY" >> $GITHUB_ENV
        echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY" >> $GITHUB_ENV
        echo "S3_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
        echo "APP_BASE_DOMAIN=$BASE_DOMAIN" >> $GITHUB_ENV
        
        # Validation
        validate_var() {
          if [ -z "$2" ]; then
            echo "Error: $1 is not set or empty"
            exit 1
          fi
        }

        validate_var "RAZORPAY_KEY" "$RAZORPAY_KEY"
        validate_var "VAPID_KEY" "$VAPID_KEY"
        validate_var "BASE_DOMAIN" "$BASE_DOMAIN"
        
        # Site Domain for Dev (subdomain)
        SITE_DOMAIN="dev.$BASE_DOMAIN"
        echo "SITE_DOMAIN=$SITE_DOMAIN" >> $GITHUB_ENV
        
        echo "COGNITO_REDIRECT_SIGNIN=https://$SITE_DOMAIN/callback" >> $GITHUB_ENV
        echo "COGNITO_REDIRECT_SIGNOUT=https://$SITE_DOMAIN/" >> $GITHUB_ENV

    - name: Generate Environment File
      run: |
        # Replace placeholders in environment.dev.ts (used by 'development' config)
        envsubst < src/environments/environment.dev.ts > src/environments/environment.dev.ts.tmp && mv src/environments/environment.dev.ts.tmp src/environments/environment.dev.ts

    - name: Sync Local Kural Data
      run: npm run sync:kural-data

    - name: Build (Development Config)
      run: npm run build:ssg:development

    - name: Sync to S3
      run: |
        aws s3 sync ./dist/frontend/browser s3://${{ env.S3_BUCKET_NAME }} --delete
        # Explicitly set content type for Service Worker files
        aws s3 cp ./dist/frontend/browser/ngsw-worker.js s3://${{ env.S3_BUCKET_NAME }}/ngsw-worker.js --content-type "application/javascript" --metadata-directive REPLACE
        aws s3 cp ./dist/frontend/browser/ngsw.json s3://${{ env.S3_BUCKET_NAME }}/ngsw.json --content-type "application/json" --metadata-directive REPLACE

    - name: Invalidate CloudFront
      run: |
        DOMAIN="${{ env.SITE_DOMAIN }}"
        DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '$DOMAIN')].Id | [0]" --output text)
        
        if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
            echo "Invalidation started for $DOMAIN ($DIST_ID)"
        else
            echo "Error: CloudFront Distribution not found for $DOMAIN"
        fi
