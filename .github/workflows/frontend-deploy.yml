name: Deploy Frontend

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment Stage (dev | prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Fetch Configuration
      id: config
      run: |
        set -e -o pipefail
        
        STAGE=${{ inputs.stage }}
        # Determine Stack Name: Prod uses legacy name 'ThirukkuralStack', others use 'ThirukkuralStack-{Stage}'
        STACK_NAME="ThirukkuralStack"
        if [ "$STAGE" != "prod" ]; then 
             # Capitalize first letter for stack name convention if needed, or matched CDK logic
             # In CDK bin: `ThirukkuralStack-${stage.charAt(0).toUpperCase() + stage.slice(1)}`
             # Bash capitalizer:
             CAP_STAGE="$(tr '[:lower:]' '[:upper:]' <<< ${STAGE:0:1})${STAGE:1}"
             STACK_NAME="ThirukkuralStack-$CAP_STAGE"
        fi
        
        echo "Fetching outputs from Stack: $STACK_NAME"
        
        get_output() {
          local val
          val=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text)
          if [ $? -ne 0 ]; then
             echo "Error fetching output $1 from stack $STACK_NAME" >&2
             exit 1
          fi
          echo "$val"
        }
        
        # Fetch and Validate Stack Outputs
        API_URL=$(get_output 'ApiUrl')
        USER_POOL_ID=$(get_output 'UserPoolId')
        CLIENT_ID=$(get_output 'UserPoolClientId')
        USER_POOL_DOMAIN=$(get_output 'UserPoolDomain')
        # Strip https:// prefix as Amplify expects just the domain
        USER_POOL_DOMAIN=${USER_POOL_DOMAIN#https://}
        BUCKET_NAME=$(get_output 'WebsiteBucketName')
        
        # Validation
        check_val() {
          if [ -z "$2" ] || [ "$2" == "None" ]; then
            echo "Error: Critical value $1 is missing or empty." >&2
            exit 1
          fi
        }

        check_val "API_URL" "$API_URL"
        check_val "USER_POOL_ID" "$USER_POOL_ID"
        check_val "CLIENT_ID" "$CLIENT_ID"
        check_val "USER_POOL_DOMAIN" "$USER_POOL_DOMAIN"
        check_val "BUCKET_NAME" "$BUCKET_NAME"

        echo "Retrieved Bucket: $BUCKET_NAME"

        # Fetch Base Domain and VAPID Key from SSM
        VAPID_KEY=$(aws ssm get-parameter --name "/$STAGE/thirukkural/vapid_public_key" --query "Parameter.Value" --output text)
        BASE_DOMAIN=$(aws ssm get-parameter --name "/$STAGE/thirukkural/base_domain" --query "Parameter.Value" --output text)
        RAZORPAY_KEY=$(aws ssm get-parameter --name "/$STAGE/thirukkural/razorpay_key_id" --with-decryption --query "Parameter.Value" --output text)
        
        check_val "VAPID_PUBLIC_KEY" "$VAPID_KEY"
        check_val "BASE_DOMAIN" "$BASE_DOMAIN"
        
        echo "API_BASE_URL=$API_URL" >> $GITHUB_ENV
        echo "COGNITO_USER_POOL_ID=$USER_POOL_ID" >> $GITHUB_ENV
        echo "COGNITO_WEB_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
        echo "COGNITO_DOMAIN=$USER_POOL_DOMAIN" >> $GITHUB_ENV
        echo "VAPID_PUBLIC_KEY=$VAPID_KEY" >> $GITHUB_ENV
        echo "RAZORPAY_KEY_ID=$RAZORPAY_KEY" >> $GITHUB_ENV
        echo "S3_BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV
        echo "APP_BASE_DOMAIN=$BASE_DOMAIN" >> $GITHUB_ENV
        
        # Construct Site Domain
        if [ "$STAGE" == "prod" ]; then
             SITE_DOMAIN="$BASE_DOMAIN"
        else
             SITE_DOMAIN="$STAGE.$BASE_DOMAIN"
        fi
        
        echo "SITE_DOMAIN=$SITE_DOMAIN" >> $GITHUB_ENV
        
        echo "COGNITO_REDIRECT_SIGNIN=https://$SITE_DOMAIN/callback" >> $GITHUB_ENV
        echo "COGNITO_REDIRECT_SIGNOUT=https://$SITE_DOMAIN/" >> $GITHUB_ENV

    - name: Generate Environment File
      run: |
        # Replace placeholders in environment files with actual values
        # We process BOTH dev and prod files so they are ready for whichever build config uses them
        envsubst < src/environments/environment.prod.ts > src/environments/environment.prod.ts.tmp && mv src/environments/environment.prod.ts.tmp src/environments/environment.prod.ts
        envsubst < src/environments/environment.dev.ts > src/environments/environment.dev.ts.tmp && mv src/environments/environment.dev.ts.tmp src/environments/environment.dev.ts

    - name: Build
      run: |
        # Map stage to Angular configuration
        # Assuming 'production' config for prod, 'development' for dev/others? 
        # Or maybe create 'uat' config in angular.json later.
        CONFIG="production" 
        if [ "${{ inputs.stage }}" != "prod" ]; then CONFIG="development"; fi
        
        npm run build -- --configuration $CONFIG

    - name: Sync to S3
      run: |
        aws s3 sync ./dist/frontend/browser s3://${{ env.S3_BUCKET_NAME }} --delete
        # Explicitly set content type for Service Worker files
        aws s3 cp ./dist/frontend/browser/ngsw-worker.js s3://${{ env.S3_BUCKET_NAME }}/ngsw-worker.js --content-type "application/javascript" --metadata-directive REPLACE
        aws s3 cp ./dist/frontend/browser/ngsw.json s3://${{ env.S3_BUCKET_NAME }}/ngsw.json --content-type "application/json" --metadata-directive REPLACE

    - name: Invalidate CloudFront
      run: |
        DOMAIN="${{ env.SITE_DOMAIN }}"
        echo "Invalidating for domain: $DOMAIN"
        
        DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null] | [?contains(Aliases.Items, '$DOMAIN')].Id | [0]" --output text)
        
        if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
        else
            echo "Could not find Distribution ID for domain $DOMAIN. Skipping invalidation."
            echo "NOTE: Check if your CloudFront distribution has the correct Alias/CNAME."
        fi
