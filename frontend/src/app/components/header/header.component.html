<header class="main-header">
  <nav class="nav-container">
    <a class="nav-brand" routerLink="/" style="cursor: pointer; text-decoration: none; color: inherit;">
      <img src="logo.jpg" alt="Thirukkural Logo" class="brand-logo">
      <span class="brand-text">Thirukkural</span>
    </a>

    <!-- Desktop Navigation -->
    <div class="nav-links">
      <!-- Common Links -->

      <!-- Public Only Links -->
      <ng-container *ngIf="!(user$ | async)">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
        <a routerLink="/kurals" routerLinkActive="active" class="nav-link">Library</a>
        <a routerLink="/pricing" routerLinkActive="active" class="nav-link">Pricing</a>
        <a routerLink="/about" routerLinkActive="active" class="nav-link">About</a>
        <a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a>
      </ng-container>

      <!-- Logged In Links -->
      <ng-container *ngIf="user$ | async">
        <a routerLink="/profile" routerLinkActive="active" class="nav-link">Dashboard</a>
        <a routerLink="/kurals" routerLinkActive="active" class="nav-link">Library</a>
      </ng-container>
    </div>

    <!-- Desktop Actions -->
    <div class="nav-actions desktop-actions">
      <button mat-button class="btn-subscribe" (click)="subscribeToNotifications()" title="Get Daily Wisdom">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" />
        </svg>
      </button>

      <button mat-button class="btn-install" *ngIf="showInstallButton$ | async" (click)="installPwa()" aria-label="Install App">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 4px;">
          <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
        </svg>
        Install
      </button>

      <button mat-button class="btn-theme" (click)="toggleTheme()" aria-label="Toggle Dark Mode">
        <svg *ngIf="!(isDarkMode$ | async)" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="isDarkMode$ | async" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <ng-container *ngIf="user$ | async as user; else loginBtn">
        <div class="user-menu">
          <a class="user-avatar" routerLink="/profile" style="cursor: pointer; text-decoration: none;"
            aria-label="Profile">{{
            user?.attributes?.email?.[0]?.toUpperCase() }}</a>
          <button mat-button class="btn-logout" (click)="logout()">Sign Out</button>
        </div>
      </ng-container>

      <ng-template #loginBtn>
        <button mat-button class="btn-login" (click)="login()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 9a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"
              fill="currentColor" />
          </svg>
          Sign In
        </button>
      </ng-template>
    </div>

    <!-- Hamburger Menu Button (Mobile Only) -->
    <button class="hamburger-btn" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen"
      aria-label="Toggle menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div class="mobile-menu-overlay" [class.active]="isMobileMenuOpen" (click)="closeMobileMenu()"></div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.active]="isMobileMenuOpen">
    <div class="mobile-menu-header">
      <div class="nav-brand">
        <img src="logo.jpg" alt="Thirukkural Logo" class="brand-logo">
        <span class="brand-text">Thirukkural</span>
      </div>
    </div>

    <div class="mobile-menu-content">
      <div class="mobile-nav-links">
        <!-- Public Links (Only if NOT logged in) -->
        <ng-container *ngIf="!(user$ | async)">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="mobile-nav-link"
            (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M3 10l7-7 7 7M4 9v8a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 011-1h2a1 1 0 011 1v3a1 1 0 001 1h3a1 1 0 001-1V9"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Home
          </a>
          <a routerLink="/kurals" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M5 4h10a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2zM7 8h6M7 12h4"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Library
          </a>
          <a routerLink="/pricing" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
              <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            Pricing
          </a>
          <a routerLink="/about" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 18a8 8 0 100-16 8 8 0 000 16zM10 11v4M10 7h.01" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" />
            </svg>
            About
          </a>
          <a routerLink="/contact" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Contact
          </a>
        </ng-container>

        <!-- Logged In Links -->
        <ng-container *ngIf="user$ | async">
          <a routerLink="/profile" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
          </a>
          <a routerLink="/kurals" routerLinkActive="active" class="mobile-nav-link" (click)="closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M5 4h10a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2zM7 8h6M7 12h4"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Library
          </a>
        </ng-container>
      </div>

      <div class="mobile-menu-actions">
        <button mat-button class="mobile-btn" (click)="subscribeToNotifications(); closeMobileMenu()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" />
          </svg>
          Enable Notifications
        </button>

        <button mat-button class="mobile-btn" *ngIf="showInstallButton$ | async"
          (click)="installPwa(); closeMobileMenu()" aria-label="Install App">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
          </svg>
          Install App
        </button>

        <button mat-button class="mobile-btn" (click)="toggleTheme(); closeMobileMenu()" aria-label="Toggle Theme">
          <svg *ngIf="!(isDarkMode$ | async)" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg *ngIf="isDarkMode$ | async" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <span *ngIf="!(isDarkMode$ | async)">Dark Mode</span>
          <span *ngIf="isDarkMode$ | async">Light Mode</span>
        </button>

        <ng-container *ngIf="user$ | async as user; else mobileLoginBtn">
          <a class="mobile-user-info" routerLink="/profile" (click)="closeMobileMenu()"
            style="text-decoration: none; color: inherit;" aria-label="Profile">
            <div class="user-avatar">{{ user?.attributes?.email?.[0]?.toUpperCase() }}</div>
            <span class="user-email">{{ user?.attributes?.email }}</span>
          </a>
          <button mat-button class="btn-logout mobile-btn" (click)="logout(); closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M9 3H5a2 2 0 00-2 2v10a2 2 0 002 2h4M15 10l4-4m0 0l-4-4m4 4H9" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" />
            </svg>
            Sign Out
          </button>
        </ng-container>

        <ng-template #mobileLoginBtn>
          <button mat-button class="btn-login mobile-btn" (click)="login(); closeMobileMenu()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 10a4 4 0 100-8 4 4 0 000 8zm0 2c-4.42 0-8 1.79-8 4v2h16v-2c0-2.21-3.58-4-8-4z"
                fill="currentColor" />
            </svg>
            Sign In
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</header>
