name: Lighthouse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Sync Local Kural Data
      run: npm run sync:kural-data

    - name: Build Prerendered Frontend
      run: npm run build:ssg:development

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Resolve Chromium Path
      id: chromium
      shell: bash
      run: |
        CHROME_PATH=$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath());")
        echo "path=$CHROME_PATH" >> "$GITHUB_OUTPUT"

    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.15.0

    - name: Run Lighthouse CI Collect
      env:
        CHROME_PATH: ${{ steps.chromium.outputs.path }}
      run: lhci collect --config=./lighthouserc.js

    - name: Run Lighthouse CI Assert
      env:
        CHROME_PATH: ${{ steps.chromium.outputs.path }}
      run: lhci assert --config=./lighthouserc.js

    - name: Upload Lighthouse Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-report
        path: frontend/.lighthouseci/
        retention-days: 30
