<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Daily Thirukkural Widget</title>
  <style>
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Noto Sans Tamil';
      font-style: normal;
      font-weight: 400 700;
      font-stretch: 100%;
      font-display: swap;
      src: url('/fonts/noto-sans-tamil-tamil.woff2') format('woff2');
      unicode-range: U+0964-0965, U+0B82-0BFA, U+200C-200D, U+20B9, U+25CC;
    }

    @font-face {
      font-family: 'Noto Sans Tamil';
      font-style: normal;
      font-weight: 400 700;
      font-stretch: 100%;
      font-display: swap;
      src: url('/fonts/noto-sans-tamil-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
        U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
        U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      --widget-accent: #2563eb;
      --widget-accent-soft: rgba(37, 99, 235, 0.12);
      --widget-bg: #ffffff;
      --widget-surface: #f8fafc;
      --widget-text: #0f172a;
      --widget-subtle: #475569;
      --widget-border: rgba(37, 99, 235, 0.14);
      --widget-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      color-scheme: light;
    }

    [data-theme="dark"] {
      --widget-bg: #0f172a;
      --widget-surface: #162338;
      --widget-text: #f8fafc;
      --widget-subtle: #cbd5e1;
      --widget-border: rgba(96, 165, 250, 0.24);
      --widget-shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      color-scheme: dark;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Inter', sans-serif;
    }

    body {
      padding: 8px;
    }

    .widget-card {
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--widget-border);
      background:
        radial-gradient(circle at top left, var(--widget-accent-soft), transparent 46%),
        linear-gradient(180deg, var(--widget-bg), var(--widget-surface));
      box-shadow: var(--widget-shadow);
      color: var(--widget-text);
    }

    .widget-inner {
      padding: 18px;
    }

    .widget-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--widget-accent);
    }

    .widget-title {
      margin: 12px 0 6px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .widget-meta {
      margin: 0;
      font-size: 13px;
      color: var(--widget-subtle);
    }

    .widget-lines {
      margin: 18px 0 14px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    [data-theme="dark"] .widget-lines {
      background: rgba(15, 23, 42, 0.32);
    }

    .widget-lines p {
      margin: 0;
      font-family: 'Noto Sans Tamil', sans-serif;
      font-size: 19px;
      line-height: 1.8;
      text-align: center;
    }

    .widget-lines p + p {
      margin-top: 4px;
    }

    .widget-translation {
      margin: 0;
      color: var(--widget-subtle);
      line-height: 1.7;
      font-size: 14px;
    }

    .widget-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .widget-tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
      border: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 12px;
      font-weight: 700;
      color: var(--widget-subtle);
    }

    [data-theme="dark"] .widget-tag {
      background: rgba(15, 23, 42, 0.42);
    }

    .widget-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .widget-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 12px;
      background: var(--widget-accent);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }

    .widget-brand {
      font-size: 12px;
      color: var(--widget-subtle);
      text-align: right;
    }

    .widget-brand a {
      color: inherit;
      text-decoration: none;
      font-weight: 700;
    }

    .widget-loading,
    .widget-error {
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--widget-subtle);
      border-radius: 20px;
      border: 1px solid var(--widget-border);
      background: linear-gradient(180deg, var(--widget-bg), var(--widget-surface));
      box-shadow: var(--widget-shadow);
    }
  </style>
</head>
<body>
  <div id="widget-root" class="widget-loading">Loading today&apos;s Thirukkural...</div>
  <script src="/widgets/daily-kural-frame.js" defer></script>
</body>
</html>
