name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment Stage (dev | prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      confirm_prod:
        description: 'Check to confirm PROD deployment'
        required: true
        type: boolean
        default: false
      setup_ssm:
        description: 'Run SSM Setup Script (Safe: Will not overwrite existing secrets)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Safety Check
      if: ${{ inputs.stage == 'prod' && inputs.confirm_prod != true }}
      run: |
        echo "Error: You must check 'confirm_prod' to deploy to Production."
        exit 1

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Run SSM Setup
      if: ${{ inputs.setup_ssm == true }}
      run: npm run setup-ssm
      env:
        STAGE: ${{ inputs.stage }}

    - name: Bootstrap CDK
      run: npx cdk bootstrap --skip-if-bootstrapped

    - name: Deploy CDK Stack
      run: npx cdk deploy --require-approval never -c stage=${{ inputs.stage }}
      # No env vars needed! CDK fetches from SSM.
