name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Deployment Stage (dev | prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      confirm_prod:
        description: 'Check to confirm PROD deployment'
        required: true
        type: boolean
        default: false
      setup_ssm:
        description: 'Run SSM Setup Script (Safe: Will not overwrite existing secrets)'
        required: false
        type: boolean
        default: false
      seed_db:
        description: 'Seed Database'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Safety Check
      if: ${{ inputs.stage == 'prod' && inputs.confirm_prod != true }}
      run: |
        echo "Error: You must check 'confirm_prod' to deploy to Production."
        exit 1

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Run SSM Setup
      if: ${{ inputs.setup_ssm == true }}
      run: npm run setup-ssm
      env:
        STAGE: ${{ inputs.stage }}

    - name: Bootstrap CDK
      if: ${{ inputs.setup_ssm != true }}
      run: npx cdk bootstrap --skip-if-bootstrapped

    - name: Deploy CDK Stack
      if: ${{ inputs.setup_ssm != true }}
      run: npx cdk deploy --require-approval never -c stage=${{ inputs.stage }}
      # No env vars needed! CDK fetches from SSM.

    - name: Seed Database
      if: ${{ inputs.seed_db == true && inputs.setup_ssm != true }}
      run: |
        set -e
        STAGE=${{ inputs.stage }}
        # Determine Stack Name logic (copied from frontend pipeline or simplified)
        STACK_NAME="ThirukkuralStack"
        if [ "$STAGE" != "prod" ]; then 
             # Simple bash capitalization for Dev/Uat etc.
             CAP_STAGE="$(tr '[:lower:]' '[:upper:]' <<< ${STAGE:0:1})${STAGE:1}"
             STACK_NAME="ThirukkuralStack-$CAP_STAGE"
        fi
        
        echo "Fetching Table Name from Stack: $STACK_NAME"
        
        TABLE_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='KuralTableName'].OutputValue" --output text)
        
        if [ -z "$TABLE_NAME" ] || [ "$TABLE_NAME" == "None" ]; then
            echo "Error: Could not fetch KuralTableName from stack."
            exit 1
        fi
        
        echo "Seeding table: $TABLE_NAME"
        
        export KURAL_TABLE=$TABLE_NAME
        export AWS_REGION=ap-south-1
        
        npm run seed
